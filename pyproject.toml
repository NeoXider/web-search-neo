[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-search-neo"
version = "1.18.1"
description = "Free API-keyless web search and visible Chrome automation for AI agents over MCP."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.29,<2",
    "pydantic-settings>=2.14,<2.15",
    "ddgs>=9.14,<10",
    "requests>=2.32,<3",
    "beautifulsoup4>=4.13,<5",
    "selenium>=4.34,<5",
    "websockets>=15,<18",
]

[project.scripts]
wsn = "web_search_neo.main:main"

[project.urls]
Homepage = "https://github.com/NeoXider/web-search-neo"

# The flat layout also holds `skills/`, so packages are listed explicitly.
# tests/test_fetch_hardening.py fails when this list drifts from the source tree.
# `web_search_neo.chrome_extension` is the repository's chrome-extension/
# folder, shipped so an installed wheel still carries the unpacked extension.
[tool.setuptools]
packages = [
    "web_search_neo",
    "web_search_neo.actions",
    "web_search_neo.cdp",
    "web_search_neo.contract",
    "web_search_neo.fetch",
    "web_search_neo.perception",
    "web_search_neo.sessions",
    "web_search_neo.chrome_extension",
]
include-package-data = false

[tool.setuptools.package-dir]
"web_search_neo.chrome_extension" = "chrome-extension"

[tool.setuptools.package-data]
"web_search_neo.chrome_extension" = ["*.js", "*.json", "*.html", "*.css", "icons/*.png"]

[tool.setuptools.exclude-package-data]
# The machine-local companion secret must never be baked into a wheel.
"web_search_neo.chrome_extension" = ["bridge-token.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No single test needs two minutes; anything longer is a hung browser session.
addopts = "-ra --strict-markers --timeout=120"
markers = [
    "desktop_input: may capture the OS cursor; requires --run-desktop-input",
    "live: tests that call public internet services or a local model server",
]
