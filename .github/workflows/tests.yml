name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows carries the companion bootstrap and the PowerShell launcher, so
        # a green Linux-only run says nothing about the flagship path.
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Enforce module size and dependency boundaries
        run: python scripts/check_module_size.py
      - name: Run tests
        run: python -m pytest -q --junit-xml=results.xml
      - name: Fail if the browser suite silently skipped
        shell: python
        run: |
          import sys
          import xml.etree.ElementTree as ElementTree

          suite = ElementTree.parse("results.xml").getroot().find("testsuite")
          skipped = int(suite.get("skipped", "0"))
          total = int(suite.get("tests", "0"))
          print(f"{total} tests, {skipped} skipped")
          # Every browser test skips itself when Chrome is missing, which would
          # otherwise leave the suite green with no browser coverage at all.
          if skipped > total // 4:
              sys.exit(f"{skipped}/{total} tests skipped; Chrome was probably unavailable")

  package:
    # The flat layout once refused to build ("Multiple top-level packages"),
    # and a checkout-only test run cannot notice: build the wheel, install it
    # into a clean venv, and import the server from outside the source tree.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - name: Build the wheel
        run: python -m build --wheel --outdir dist
      - name: Install the wheel into a fresh venv and import it
        shell: python
        run: |
          import glob
          import os
          import subprocess
          import sys
          import tempfile
          import venv

          wheel = os.path.abspath(glob.glob("dist/*.whl")[0])
          target = tempfile.mkdtemp(prefix="wsn-wheel-")
          venv.create(target, with_pip=True)
          scripts = "Scripts" if os.name == "nt" else "bin"
          python = os.path.join(target, scripts, "python")
          subprocess.run([python, "-m", "pip", "install", wheel], check=True)
          # Run from an unrelated directory so the checkout cannot shadow the wheel.
          check = (
              "import pathlib, web_search_neo.main as m;"
              "ext = pathlib.Path(m.__file__).parent / 'chrome_extension';"
              "assert (ext / 'manifest.json').is_file(), ext;"
              "assert not (ext / 'bridge-token.js').exists();"
              "print('imported', m.__file__)"
          )
          subprocess.run([python, "-c", check], check=True, cwd=target)
          entry = os.path.join(target, scripts, "wsn" + (".exe" if os.name == "nt" else ""))
          if not os.path.isfile(entry):
              sys.exit(f"console script missing: {entry}")
