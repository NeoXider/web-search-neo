<!doctype html>
<html>
<head><meta charset="utf-8"><title>Archive</title></head>
<body>
<h1>Archive</h1>
<p id="body-copy"></p>
<!-- The article is all still in the DOM; a captcha modal sits on top of it, so
     nothing on the page can be acted on until a human clears it. -->
<div id="scrim" style="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999">
  <div class="g-recaptcha" data-sitekey="6Lc_aaaa"
       style="position:absolute;left:50%;top:50%;width:304px;height:78px;
              margin:-39px 0 0 -152px;background:#fff"></div>
</div>
<script>
  document.getElementById('body-copy').textContent =
    'Twenty years of back issues, indexed and searchable. '.repeat(60);
</script>
</body>
</html>
