<!doctype html>
<html>
<head><meta charset="utf-8"><title>Verification</title></head>
<body style="margin:0">
<div id="gate"></div>
<script>
  // Providers that ship a web component put the whole challenge behind an open
  // shadow root, where a top-level querySelector never looks.
  const root = document.getElementById('gate').attachShadow({mode: 'open'});
  root.innerHTML =
    '<div class="cf-turnstile" data-sitekey="0x4AAAAAAA" ' +
    'style="width:300px;height:65px;border:1px solid #ccc"></div>';
</script>
</body>
</html>
