<!doctype html>
<html>
<head><meta charset="utf-8"><title>Attachments</title></head>
<body>
<h1>Attachments</h1>
<form id="attachments">
  <input id="many" name="many" type="file" multiple>
  <input id="one" name="one" type="file">
</form>
<script>
  window.attachedNames = () =>
    Array.from(document.getElementById('many').files).map(file => file.name);
</script>
</body>
</html>
