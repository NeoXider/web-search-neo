<!doctype html>
<html>
<head><meta charset="utf-8"><title>Application form</title></head>
<body>
<form id="application" action="frame_done.html" method="get">
  <input id="candidate" name="candidate">
  <input id="resume" name="resume" type="file">
  <button id="send" type="submit">Apply</button>
</form>
<p id="clicked">not clicked</p>
<button id="ping" type="button"
        onclick="document.getElementById('clicked').textContent = 'clicked'">Ping</button>
<p id="late"></p>
<script>
  setTimeout(() => { document.getElementById('late').textContent = 'ready'; }, 300);
</script>
</body>
</html>
