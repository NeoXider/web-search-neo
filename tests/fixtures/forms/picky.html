<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fields that refuse what they are given</title></head>
<body>
<h1>Picky fields</h1>
<form id="picky">
  <label for="age">Age</label>
  <input id="age" name="age" type="number">

  <label for="code">Code</label>
  <input id="code" name="code" maxlength="4">

  <label for="role">Role</label>
  <select id="role" name="role">
    <option value="python">Python</option>
    <option value="unity" disabled>Unity Developer</option>
  </select>

  <label for="locked">Locked</label>
  <input id="locked" name="locked" readonly value="fixed">

  <label for="off">Disabled</label>
  <input id="off" name="off" disabled value="untouchable">

  <label for="digits">Digits only</label>
  <input id="digits" name="digits" oninput="this.value = this.value.replace(/[^0-9]/g, '')">

  <label for="free">Free text</label>
  <input id="free" name="free">

  <!-- The value sanitisation algorithm strips the whitespace around an email or
       a url before the field ever holds it, and a change handler is free to trim
       or fold case as well. The field took the value in all three cases. -->
  <label for="email">Email</label>
  <input id="email" name="email" type="email">

  <label for="site">Site</label>
  <input id="site" name="site" type="url">

  <label for="city">City</label>
  <input id="city" name="city"
         onchange="this.value = this.value.trim().toLowerCase()">
</form>
</body>
</html>
