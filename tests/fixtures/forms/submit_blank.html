<!doctype html>
<html>
<head><meta charset="utf-8"><title>Print preview</title></head>
<body>
<h1>Print preview</h1>
<!-- The result of this form is delivered to a new tab; this document stays
     exactly as it was, so its url and title describe nothing that happened. -->
<form id="preview" action="/submit" method="post" target="_blank">
  <input id="report" name="report" value="quarterly">
  <button id="open-preview" type="submit">Open preview</button>
</form>
</body>
</html>
