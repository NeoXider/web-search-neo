<!doctype html>
<html>
<head><meta charset="utf-8"><title>Focus and click probe</title></head>
<body>
  <p>Ticker: <span id="ticker">0</span></p>
  <input id="plain">
  <input id="ro" readonly value="fixed">
  <x-editor id="editor"></x-editor>
  <iframe id="frame" srcdoc="<textarea id='inner'></textarea>"></iframe>
  <section id="panel">
    <button id="noop" type="button">Nothing</button>
    <button id="toggle" type="button">Toggle</button>
  </section>
  <div id="elsewhere"></div>
  <script>
    // Unrelated page activity: a clock that mutates the DOM all the time.
    let ticks = 0;
    setInterval(() => {
      document.getElementById("ticker").textContent = String(++ticks);
      document.getElementById("elsewhere").setAttribute("data-tick", String(ticks));
    }, 20);
    document.getElementById("toggle").addEventListener("click", event => {
      event.currentTarget.setAttribute("aria-pressed", "true");
    });
    customElements.define("x-editor", class extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({mode: "open"}).innerHTML = "<input id='shadow-input'>";
      }
    });
  </script>
</body>
</html>
