<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Scroll and pagination fixture</title>
  <style>
    body { min-height: 3600px; margin: 0; }
    #below-fold { position: absolute; top: 2200px; left: 20px; }
    #many { position: absolute; top: 2500px; left: 20px; width: 900px; }
  </style>
</head>
<body>
  <p>Top of page</p>
  <button id="below-fold">Existing below viewport</button>
  <div id="many"></div>
  <script>
    const many = document.getElementById('many');
    for (let index = 0; index < 1205; index += 1) {
      const button = document.createElement('button');
      button.id = `page-button-${index}`;
      button.textContent = `Page button ${index}`;
      many.appendChild(button);
    }
    window.addEventListener('scroll', () => {
      if (window.scrollY <= 0 || document.getElementById('lazy-button')) return;
      const button = document.createElement('button');
      button.id = 'lazy-button';
      button.textContent = 'Lazy after scroll';
      document.body.appendChild(button);
    });
  </script>
</body>
</html>
