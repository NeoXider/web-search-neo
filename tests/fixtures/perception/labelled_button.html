<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Labelled</title><link rel="icon" href="data:,"></head>
<body>
<!-- The accessible name is the aria-label; the words a person can see, and will
     therefore ask for, are the ones inside the button. -->
<button id="send" aria-label="Compose a new support request">Send message</button>
<a id="away" href="/relative">Somewhere else</a>
</body>
</html>
