<head><meta charset="utf-8"><title>A dialog in a dialog</title><link rel="icon" href="data:,"></head>
<body>
<main><p>MAIN-BODY the page behind the wall, long enough that the landmark is a
  fair guess at where this document keeps its words.</p></main>
<dialog open id="wall">
  <p>OUTER-WALL accept tracking to continue reading.</p>
  <div role="alertdialog"><p>INNER-ALERT your session is about to expire.</p></div>
</dialog>
