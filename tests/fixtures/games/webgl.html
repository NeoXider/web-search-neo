<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture: WebGL2 triangle</title>
<link rel="icon" href="data:,">

<style>
  body { margin: 0; padding: 12px; background: #10131a; color: #d7dde8;
         font: 13px/1.4 monospace; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  #gl { background: #000; border: 1px solid #3a4560; display: block; outline: none; }
  #gl:focus { box-shadow: 0 0 0 2px #4da3ff; }
  #hud { margin: 8px 0 0; white-space: pre; }
</style>
</head>
<body>
<h1>webgl fixture &mdash; press 1 / 2 / 3 to recolour the triangle (all three = win)</h1>
<canvas id="gl" tabindex="0" width="480" height="320"></canvas>
<p id="hud">booting…</p>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('gl');
  var hud = document.getElementById('hud');

  // Public state. `context` reports what was actually acquired, never a guess.
  var game = {
    frame: 0,
    context: 'none',      // 'webgl2' | 'webgl' | 'none'
    vendor: '',
    renderer: '',
    color: 'gray',        // current colour name
    won: false,           // true once red, green and blue have each been shown
    colorsSeen: [],
    error: null
  };
  window.__game = game;

  // Try WebGL2 first, fall back honestly to WebGL1.
  var gl = canvas.getContext('webgl2');
  if (gl) {
    game.context = 'webgl2';
  } else {
    gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (gl) game.context = 'webgl';
  }

  if (!gl) {
    game.error = 'no webgl context available';
    hud.textContent = 'ERROR: ' + game.error;
    return;
  }

  game.vendor = String(gl.getParameter(gl.VENDOR) || '');
  game.renderer = String(gl.getParameter(gl.RENDERER) || '');
  // Unmasked strings are more informative when the extension is exposed.
  var dbg = gl.getExtension('WEBGL_debug_renderer_info');
  if (dbg) {
    game.vendor = String(gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) || game.vendor);
    game.renderer = String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || game.renderer);
  }

  // GLSL ES 1.00 shaders: valid on both webgl1 and webgl2 contexts.
  var VERT =
    'attribute vec2 aPos;\n' +
    'void main() { gl_Position = vec4(aPos, 0.0, 1.0); }\n';
  var FRAG =
    'precision mediump float;\n' +
    'uniform vec3 uColor;\n' +
    'void main() { gl_FragColor = vec4(uColor, 1.0); }\n';

  function compile(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      game.error = 'shader: ' + gl.getShaderInfoLog(sh);
      return null;
    }
    return sh;
  }

  var vs = compile(gl.VERTEX_SHADER, VERT);
  var fs = compile(gl.FRAGMENT_SHADER, FRAG);
  var prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    game.error = 'link: ' + gl.getProgramInfoLog(prog);
  }
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0.8, -0.8, -0.7, 0.8, -0.7]), gl.STATIC_DRAW);
  var aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  var uColor = gl.getUniformLocation(prog, 'uColor');

  var PALETTE = {
    red:   [0.90, 0.15, 0.15],
    green: [0.15, 0.85, 0.30],
    blue:  [0.20, 0.40, 0.95],
    gray:  [0.45, 0.48, 0.55]
  };
  var KEY_TO_COLOR = { '1': 'red', '2': 'green', '3': 'blue',
                       'Digit1': 'red', 'Digit2': 'green', 'Digit3': 'blue',
                       'Numpad1': 'red', 'Numpad2': 'green', 'Numpad3': 'blue' };

  function setColor(name) {
    if (!PALETTE[name]) return;
    game.color = name;
    if (game.colorsSeen.indexOf(name) === -1) game.colorsSeen.push(name);
    if (!game.won &&
        game.colorsSeen.indexOf('red') !== -1 &&
        game.colorsSeen.indexOf('green') !== -1 &&
        game.colorsSeen.indexOf('blue') !== -1) {
      game.won = true;
    }
  }

  function onKeyDown(e) {
    var name = KEY_TO_COLOR[e.key] || KEY_TO_COLOR[e.code];
    if (!name) return;
    e.preventDefault();
    setColor(name);
  }
  canvas.addEventListener('keydown', onKeyDown);
  window.addEventListener('keydown', function (e) { if (e.target !== canvas) onKeyDown(e); });
  canvas.addEventListener('mousedown', function () { canvas.focus(); });

  gl.viewport(0, 0, canvas.width, canvas.height);

  function frame() {
    game.frame += 1;
    var c = PALETTE[game.color] || PALETTE.gray;
    gl.clearColor(0.04, 0.05, 0.08, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform3f(uColor, c[0], c[1], c[2]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    hud.textContent = 'frame=' + game.frame + ' context=' + game.context +
                      ' vendor=' + game.vendor + ' color=' + game.color +
                      ' seen=[' + game.colorsSeen.join(',') + '] won=' + game.won;
    requestAnimationFrame(frame);
  }

  canvas.focus();
  window.addEventListener('load', function () { canvas.focus(); });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
