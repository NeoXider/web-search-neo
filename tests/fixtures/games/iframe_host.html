<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture: offset iframe host</title>
<link rel="icon" href="data:,">

<style>
  html, body { margin: 0; padding: 0; background: #0b0e14; color: #d7dde8;
               font: 13px/1.4 monospace; }
  #banner { padding: 8px 12px; background: #161b26; border-bottom: 1px solid #3a4560; }
  /* The offset is the whole point: CDP Input coordinates are expressed in the
     top-level page, so any pointer aimed at the game must be shifted by it. */
  #game-frame {
    margin: 80px 0 0 120px;
    border: 4px solid #4da3ff;
    width: 660px;
    height: 460px;
    display: block;
    background: #000;
  }
  #offset { margin: 12px; white-space: pre; }
  .tag { color: #facc15; }
</style>
</head>
<body>
<div id="banner">iframe host &mdash; the game is offset from the top-left corner on purpose</div>

<iframe id="game-frame" src="platformer.html" title="platformer"></iframe>

<p id="offset">measuring…</p>

<script>
(function () {
  'use strict';

  var frame = document.getElementById('game-frame');
  var out = document.getElementById('offset');

  // Declared offset from the stylesheet, kept next to the measured one so a
  // test can catch a stylesheet/measurement drift immediately.
  var DECLARED = { x: 120, y: 80 };

  function measure() {
    var rect = frame.getBoundingClientRect();
    var cs = window.getComputedStyle(frame);
    var borderLeft = parseFloat(cs.borderLeftWidth) || 0;
    var borderTop = parseFloat(cs.borderTopWidth) || 0;
    var padLeft = parseFloat(cs.paddingLeft) || 0;
    var padTop = parseFloat(cs.paddingTop) || 0;

    // Origin of the iframe *content* box in top-level page coordinates. This is
    // the value a caller must add to in-frame coordinates before dispatching a
    // CDP Input event.
    var offset = {
      x: Math.round((rect.left + window.scrollX + borderLeft + padLeft) * 100) / 100,
      y: Math.round((rect.top + window.scrollY + borderTop + padTop) * 100) / 100
    };

    window.__frameOffset = {
      x: offset.x,
      y: offset.y,
      // extra diagnostics
      rectX: Math.round(rect.left * 100) / 100,
      rectY: Math.round(rect.top * 100) / 100,
      borderLeft: borderLeft,
      borderTop: borderTop,
      marginLeft: parseFloat(cs.marginLeft) || 0,
      marginTop: parseFloat(cs.marginTop) || 0,
      width: Math.round(rect.width * 100) / 100,
      height: Math.round(rect.height * 100) / 100,
      declaredX: DECLARED.x,
      declaredY: DECLARED.y,
      scrollX: window.scrollX,
      scrollY: window.scrollY
    };

    out.innerHTML =
      'frame content origin (top-level page coords): ' +
      '<span class="tag">x=' + offset.x + ' y=' + offset.y + '</span>\n' +
      'declared css margin: ' + DECLARED.x + 'px left / ' + DECLARED.y + 'px top, border ' +
      borderLeft + 'px\n' +
      'window.__frameOffset = {x: ' + offset.x + ', y: ' + offset.y + '}';
  }

  measure();
  window.addEventListener('load', measure);
  window.addEventListener('resize', measure);
  window.addEventListener('scroll', measure);
})();
</script>
</body>
</html>
